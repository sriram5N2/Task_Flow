# ================================================
# TaskFlow Application Configuration
# ================================================

# Server
server.port=8080

# ================================================
# MySQL Datasource
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# JPA / Hibernate
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================
# Static Resources (Frontend — React build output)
# ================================================
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# ================================================
# JWT Configuration
# ================================================
jwt.secret=TaskFlow@SuperSecret#Key$256bits!Long_1234567890abcdef
jwt.expiration=86400000

# ================================================
# Admin Seed Account (created on startup if absent)
# ================================================
admin.name=Admin
admin.email=admin@taskflow.com
admin.password=admin123

# ================================================
# Email / SMTP Configuration (Gmail example)
# Change to your email and App Password
# To generate an App Password: Google Account → Security → 2FA → App Passwords
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# The admin email that receives notifications
notification.admin.email=admin@taskflow.com

# ================================================
# Async (for non-blocking email sending)
# ================================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ================================================
# Logging
# ================================================
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=DEBUG
